# Publishes a GitHub release for a pushed tag vX.Y.Z, with the notes from
# CHANGELOG.md's section for X.Y.Z. RELEASING.md has the whole process.
#
# Refuses, publishing nothing, when the tag is not the version in project()
# or the changelog has nothing for it.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against project()
        run: |
          version=$(sed -nE 's/^project\(proxima VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          if [ -z "$version" ]; then
            echo "::error::no version found in project() in CMakeLists.txt"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not v$version, the version in project()"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The lines between "## [X.Y.Z]" and the next section or link.
      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Proxima $VERSION" --notes-file notes.md
