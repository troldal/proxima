# The checks that were run by hand after every change, run on every push.
#
#   linux     GCC 14, the Maxima-free suite, warnings as errors. Not Ubuntu
#             24.04's default GCC 13, which lacks parts of C++23.
#   maxima    the whole suite against a real Maxima: openSUSE Tumbleweed, in a
#             container, because it packages Maxima on SBCL, which Proxima
#             launches (Debian's and Ubuntu's Maxima is built on GCL).
#   sanitize  the maxima job under AddressSanitizer and UndefinedBehavior
#             Sanitizer, in the same container.
#   windows   MSVC, the Maxima-free suite, warnings as errors.
#   mingw     MinGW GCC from MSYS2 (UCRT64), the same, examples included.
#   consumers tests/consumer, a project using Proxima from outside: against
#             the installed library (find_package) and against the source
#             (FetchContent), with GCC 14 on Linux and MSVC on Windows.
#   tidy      clang-tidy over the library, as .clang-tidy configures it.
#   format    every C++ file as .clang-format has it, with the version the
#             tree was formatted with; and the layering ARCH.md describes.
#   fuzz      the two hand-written parsers under libFuzzer, briefly.
#   docs      the documentation site, docs/sphinx, with warnings as errors;
#             the HTML is kept as an artifact.
#   deploy-docs  that HTML published at https://docs.kinetiq.dev/proxima/,
#             for a release tag or a run started by hand, once every other
#             job has passed.
#
# Clang is 19 rather than Ubuntu 24.04's default 18: clang 18 cannot use
# libstdc++ 13's <expected>, which it hides behind a __cpp_concepts value only
# clang 19 reports.
#
# Dependencies (Boost, FXT, doctest) come through CPM, into a cache kept
# between runs.

name: CI

on:
  push:
  pull_request:
  # Run by hand from the Actions tab: the whole of CI, then deploy-docs.
  workflow_dispatch:

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/CPM.cmake') }}

      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build

      - name: Configure
        run: cmake --preset linux -DCMAKE_CXX_COMPILER=g++-14 -DPROXIMA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset linux -j 4

      - name: Test without Maxima
        run: ctest --preset linux -LE maxima

  maxima:
    runs-on: ubuntu-24.04
    container: opensuse/tumbleweed
    steps:
      # First, because checkout and the cache need git and tar.
      - name: Install Maxima, the toolchain and Ninja
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends \
            maxima maxima-exec-sbcl gcc-c++ cmake ninja git tar gzip zstd

      - uses: actions/checkout@v4

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-tumbleweed-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/CPM.cmake') }}

      - name: Configure
        run: cmake --preset linux -DPROXIMA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset linux -j 4

      # The whole suite: Tumbleweed's Maxima is the 5.50 the golden
      # transcripts were recorded with.
      - name: Test
        run: ctest --preset linux --output-on-failure

  # The maxima job's build and suite again, under AddressSanitizer and
  # UndefinedBehaviorSanitizer: the transport's pipes, threads and child
  # processes are what most need watching, and only a real Maxima exercises
  # them. Any report fails the test that triggered it.
  sanitize:
    runs-on: ubuntu-24.04
    container: opensuse/tumbleweed
    steps:
      - name: Install Maxima, the toolchain, the sanitizer runtimes and Ninja
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends \
            maxima maxima-exec-sbcl gcc-c++ libasan8 libubsan1 cmake ninja \
            git tar gzip zstd

      - uses: actions/checkout@v4

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-tumbleweed-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/CPM.cmake') }}

      - name: Configure
        run: cmake --preset linux-sanitize -DPROXIMA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset linux-sanitize -j 4

      - name: Test
        run: ctest --preset linux-sanitize

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/CPM.cmake') }}

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # cl named explicitly: the runner also has MinGW's gcc on its path.
      - name: Configure
        run: cmake --preset windows -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DPROXIMA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset windows -j 4

      # No Maxima on the runner: the suite that needs none.
      - name: Test without Maxima
        run: ctest --preset windows -LE maxima

  mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-mingw-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/CPM.cmake') }}

      # MSYS2's GCC, current, rather than the older MinGW the runner carries.
      - name: Install MinGW GCC, CMake and Ninja
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: |
          g++ --version
          cmake --preset windows -DCMAKE_CXX_COMPILER=g++ -DPROXIMA_WARNINGS_AS_ERRORS=ON

      # The examples too: std::print needs libstdc++exp linked here, and
      # nowhere else.
      - name: Build
        run: cmake --build --preset windows -j 4

      - name: Test without Maxima
        run: ctest --preset windows -LE maxima

  consumers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/CPM.cmake') }}

      - name: Install GCC 14 and Ninja
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # cl named explicitly: the runner also has MinGW's gcc on its path.
      - name: Choose MSVC
        if: runner.os == 'Windows'
        run: |
          echo "CC=cl" >> "$GITHUB_ENV"
          echo "CXX=cl" >> "$GITHUB_ENV"

      - name: Build and install Proxima
        run: |
          cmake -S . -B build/library -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DPROXIMA_BUILD_TESTS=OFF -DPROXIMA_BUILD_EXAMPLES=OFF
          cmake --build build/library -j 4
          cmake --install build/library --prefix "$RUNNER_TEMP/proxima"

      - name: Use the installed package, with find_package
        run: |
          cmake -S tests/consumer -B build/package -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/proxima"
          cmake --build build/package
          ctest --test-dir build/package --output-on-failure

      # FetchContent as a consumer would write it, pointed at this commit.
      - name: Use the source, with FetchContent
        run: |
          cmake -S tests/consumer -B build/fetch -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCONSUMER_FETCH=ON -DFETCHCONTENT_SOURCE_DIR_PROXIMA="$GITHUB_WORKSPACE"
          cmake --build build/fetch -j 4
          ctest --test-dir build/fetch --output-on-failure

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/CPM.cmake') }}

      - name: Install clang-tidy, GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-tidy-19 g++-14 ninja-build

      # Configured and built, so that the generated headers and the fetched
      # dependencies exist for clang-tidy to read.
      - name: Configure and build
        run: |
          cmake --preset linux -DCMAKE_CXX_COMPILER=g++-14
          cmake --build --preset linux -j 4

      # The pattern is anchored to the checkout: plain 'src/' also matched the
      # sources CPM builds for Boost, under .cpm-cache/boost/.../src/.
      - name: clang-tidy
        run: |
          run-clang-tidy-19 -quiet -p build/linux "^$PWD/src/" > tidy.txt 2>&1 || true
          # Findings in the dependencies are theirs, FXT's .clang-tidy failing
          # to parse among them.
          if grep -E 'warning:|error:' tidy.txt | grep -v '/.cpm-cache/'; then
            echo "clang-tidy reported findings"
            exit 1
          fi

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Pinned: clang-format's output changes between versions, and this is
      # the one the tree was formatted with.
      - name: Install clang-format
        run: pip install clang-format==23.1.0

      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror

      # The local side (expr, parse, render, numeric) works with no Maxima, so
      # it includes nothing from the kernel side: not kernel/, wire/ or
      # transport/, nor the kernel's public headers.
      - name: Check layering
        run: |
          if grep -rnE '#include ["<]((kernel|wire|transport)/|proxima/(kernel|ops|config)\.hpp)' \
               src/expr src/parse src/render src/numeric; then
            echo "the local side includes kernel-side code"
            exit 1
          fi

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/CPM.cmake') }}

      - name: Install Clang and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 libclang-rt-19-dev ninja-build

      # Two examples as well as the fuzzers: they link the instrumented library
      # too, which takes linking its sanitizer runtime. Not functional, which
      # Clang 19 cannot compile against GCC 14's std::forward_like ("function
      # with deduced return type cannot be used before it is defined"); later
      # Clangs, GCC, MSVC and clang-cl all can.
      - name: Build the fuzzers
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DPROXIMA_BUILD_FUZZERS=ON -DPROXIMA_BUILD_TESTS=OFF
          cmake --build build/fuzz -j 4 --target fuzz_parser fuzz_sexpr demo tour

      # New inputs go to a scratch directory, not the committed corpus.
      - name: Fuzz each parser for a minute
        run: |
          for target in parser sexpr; do
            mkdir -p fuzz-out/$target
            build/fuzz/fuzz/fuzz_$target -max_total_time=60 fuzz-out/$target fuzz/corpus/$target
          done

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/sphinx/requirements.txt

      # Doxygen's own release rather than Ubuntu's 1.9.8: the site is checked
      # clean with 1.18 and 1.10, and not with anything older.
      - name: Install Doxygen 1.18
        run: |
          release=https://github.com/doxygen/doxygen/releases/download/Release_1_18_0
          mkdir -p "$RUNNER_TEMP/doxygen"
          curl -fsSL "$release/doxygen-1.18.0.linux.bin.tar.gz" | tar -xz -C "$RUNNER_TEMP/doxygen"
          doxygen=$(find "$RUNNER_TEMP/doxygen" -type f -path '*/bin/doxygen' | head -n 1)
          "$doxygen" --version
          echo "DOXYGEN=$doxygen" >> "$GITHUB_ENV"

      - name: Install Sphinx, Breathe and Furo
        run: pip install -r docs/sphinx/requirements.txt

      # conf.py runs Doxygen first, from $DOXYGEN. -W: a broken link or a
      # comment Doxygen cannot read fails the job, not just a page.
      - name: Build the documentation
        run: python -m sphinx -b html -W --keep-going docs/sphinx build/docs/html

      - name: Keep the HTML
        uses: actions/upload-artifact@v4
        with:
          name: proxima-docs
          path: build/docs/html

  # With docs/sphinx/deploy.sh, over SSH, with the DOCS_DEPLOY_KEY secret: a
  # key used for nothing else, so that it can be revoked alone. RELEASING.md
  # says how to set it up.
  deploy-docs:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [linux, maxima, sanitize, windows, mingw, consumers, tidy, format, fuzz, docs]
    runs-on: ubuntu-24.04
    concurrency: deploy-docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: proxima-docs
          path: build/docs/html

      # The server's keys are pinned here, as ssh-keyscan found them on
      # 2026-09-19, rather than trusted on first sight: a server that
      # presents any other key is refused. If simply.com changes them, this
      # step fails until they are updated.
      - name: Set up the deploy key and the server's keys
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::the DOCS_DEPLOY_KEY secret is not set; RELEASING.md says how"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/docs_deploy
          chmod 600 ~/.ssh/docs_deploy
          cat > ~/.ssh/known_hosts <<'EOF'
          ssh.simply.com ssh-rsa 
          ssh.simply.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL+KKhR0mqR/sZARR7te3Wu4l2GyllgEvV2ag/gR2ApJ
          ssh.simply.com ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCU17IWM2PNpV7LI92cAu3Yyc7gcOBk8ok1/5BaYLKowlW2LKGEiy2KQg9KZN8qynBvqBz2kEJygN2uqpOnJEB0=
          EOF

      - name: Publish
        run: |
          export PROXIMA_DOCS_SSH="-i $HOME/.ssh/docs_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes"
          docs/sphinx/deploy.sh build/docs/html
